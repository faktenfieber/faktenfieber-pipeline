name: Erstellen

# Baut das naechste Video und schickt es mit ✅/❌/🚀 an Telegram.
# Normal startet der Cloudflare-Wecker diesen Workflow minutengenau um 5:30 und 15:30.
# Der GitHub-Zeitplan hier ist nur das Sicherheitsnetz, falls der Wecker mal ausfaellt.
on:
  schedule:
    - cron: "50 4,14 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Termin (leer = naechster, sofort = Extra-Video), z. B. 2026-10-29 18:00"
        required: false
        default: ""
      thema:
        description: "Wunschthema fuer ein Extra-Video (optional), z. B. Pest im Mittelalter"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: faktenfieber-daten
  cancel-in-progress: false

jobs:
  erstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Code holen (immer der neueste Stand)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Schon erledigt?
        id: check
        env:
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          pip install -q requests
          python faktenfieber.py noetig

      - name: Programme installieren
        if: steps.check.outputs.noetig == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests piper-tts faster-whisper pillow

      - name: Video bauen
        if: steps.check.outputs.noetig == '1'
        env:
          SLOT: ${{ github.event.inputs.slot }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WUNSCH_THEMA: ${{ github.event.inputs.thema }}
        run: python faktenfieber.py erstellen

      - name: Video fuer spaeter aufheben
        if: always() && steps.check.outputs.noetig == '1'
        uses: actions/upload-artifact@v4
        with:
          name: faktenfieber-video
          path: |
            output/faktenfieber.mp4
            output/meta.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Status speichern
        if: always()
        run: |
          git config user.name "faktenfieber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Video erstellt" || echo "Nichts zu speichern"
          git pull --rebase -q || true
          git push
