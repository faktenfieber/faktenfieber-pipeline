name: Erstellen

# Baut das naechste Video und schickt es mit ✅/❌ an Telegram.
# Zeiten in UTC: 4:30 / 14:30 UTC = 5:30 / 15:30 Uhr Winterzeit (6:30 / 16:30 Uhr Sommerzeit)
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Termin (leer = naechster), z. B. 2026-10-29 18:00"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: faktenfieber-daten
  cancel-in-progress: false

jobs:
  erstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Programme installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests piper-tts faster-whisper pillow

      - name: Video bauen
        env:
          SLOT: ${{ github.event.inputs.slot }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python faktenfieber.py erstellen

      - name: Video fuer spaeter aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faktenfieber-video
          path: |
            output/faktenfieber.mp4
            output/meta.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Status speichern
        if: always()
        run: |
          git config user.name "faktenfieber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Video erstellt" || echo "Nichts zu speichern"
          git pull --rebase -q || true
          git push
