name: Freigabe pruefen + posten

# Setzt deine Klicks um und postet freigegebene Videos.
# Normal startet der Cloudflare-Tuersteher diesen Workflow: sofort bei jedem Klick und minutengenau um 7:55, 11:55 und 17:55.
# Der GitHub-Zeitplan hier ist nur das Sicherheitsnetz (ca. 8:20, 12:20, 18:20), falls der Wecker mal ausfaellt.
on:
  schedule:
    - cron: "20 6,7,10,11,16,17 * * *"
  workflow_dispatch:
    inputs:
      aktion:
        description: "vom Telegram-Tuersteher: ok oder neu"
        required: false
        default: ""
      slot:
        description: "Termin, z. B. 2026-10-29 08:00"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: faktenfieber-daten
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code holen (immer der neueste Stand)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Programme installieren
        run: pip install -q requests pynacl

      - name: Freigaben pruefen + posten
        env:
          AKTION: ${{ github.event.inputs.aktion }}
          AKTION_SLOT: ${{ github.event.inputs.slot }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_SICHTBARKEIT: ${{ vars.YT_SICHTBARKEIT || 'private' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python faktenfieber.py pruefen

      - name: Status speichern
        if: always()
        run: |
          git config user.name "faktenfieber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Freigaben aktualisiert" || echo "Nichts zu speichern"
          git pull --rebase -q || true
          git push
