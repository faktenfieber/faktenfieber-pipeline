name: Freigabe pruefen + posten

# Liest deine ✅/❌-Klicks aus Telegram und postet freigegebene Videos zur geplanten Zeit.
# Zeiten in UTC. Laeuft nur rund um die Posting-Zeiten, um Gratis-Minuten zu sparen.
on:
  schedule:
    - cron: "*/30 5-9 * * *"        # Vormittag (8-Uhr-Video)
    - cron: "*/30 15-19 * * *"      # Nachmittag/Abend (18-Uhr-Video)
    - cron: "57 5,6,15,16 * * *"    # kurz vor 8:00 / 18:00 (Sommer- und Winterzeit)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: faktenfieber-daten
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Programme installieren
        run: pip install -q requests pynacl

      - name: Freigaben pruefen + posten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_SICHTBARKEIT: ${{ vars.YT_SICHTBARKEIT || 'private' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python faktenfieber.py pruefen

      - name: Status speichern
        if: always()
        run: |
          git config user.name "faktenfieber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Freigaben aktualisiert" || echo "Nichts zu speichern"
          git pull --rebase -q || true
          git push
