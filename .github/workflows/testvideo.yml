name: Testvideo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Programme installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests piper-tts faster-whisper pillow

      - name: Video bauen
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_UPLOAD: "1"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_UPLOAD: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python faktenfieber.py

      - name: Video als Download speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faktenfieber-video
          path: output/
          if-no-files-found: ignore

      - name: Benutzte Themen merken
        if: success()
        run: |
          git config user.name "faktenfieber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Neues Thema gespeichert" || echo "Nichts zu speichern"
          git push
