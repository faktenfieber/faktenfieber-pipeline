name: Status

# Schickt dir Status, Statistik oder Wochenbericht nach Telegram (/status, /stats).
# Liest nur – deshalb keine Warteschlange, kommt immer sofort.
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "status, stats oder wochenbericht"
        required: false
        default: "status"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code holen (immer der neueste Stand)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Status schicken
        env:
          AKTION: ${{ github.event.inputs.aktion }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_SICHTBARKEIT: ${{ vars.YT_SICHTBARKEIT || 'private' }}
        run: |
          pip install -q requests
          python faktenfieber.py status
